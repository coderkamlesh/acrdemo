spring:
  application:
    name: acrdemo
  main:
    banner-mode: "off"
    log-startup-info: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
      show-details: never

logging:
  level:
    root: WARN
    org.springframework.boot: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN