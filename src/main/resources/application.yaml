spring:
  application:
    name: acrdemo
  main:
    banner-mode: "off"
    log-startup-info: false
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://first-cluster-34286.j77.aws-ap-south-1.cockroachlabs.cloud:26257/defaultdb?sslmode=require
    username: ${DB_USERNAME:coderkamlesh}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 5000
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 60000          # CRDB/Lambda ke liye short rakho
      connection-test-query: SELECT 1  # Stale connection detect karo
      keepalive-time: 30000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
      show-details: never

logging:
  level:
    root: WARN
    org.springframework.boot: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    com.example.acrdemo: INFO
