name: Build and Push to ACR

on:
  push:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ca5cf566e14dacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ca5cf566e14dacr.azurecr.io/acrdemo:1.0
            ca5cf566e14dacr.azurecr.io/acrdemo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max