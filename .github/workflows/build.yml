name: Build and Push to GHCR

on:
  push:
    branches: [ Main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/acrdemo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Container Apps
        run: |
          # Step 1: Secret set karo
          az containerapp secret set \
            -n acrdemo-app \
            -g first \
            --secrets ghcr-pat=${{ secrets.GHCR_PAT }}

          # Step 2: Registry credentials set karo (password me secret ka naam pass karo)
          az containerapp registry set \
            -n acrdemo-app \
            -g first \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password secretref:ghcr-pat

          # Step 3: Image update karo
          az containerapp update \
            -n acrdemo-app \
            -g first \
            --image ghcr.io/${{ github.repository_owner }}/acrdemo:${{ github.sha }}